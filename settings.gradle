include ':smarttubetv', ':common', ':chatkit', ':leanbackassistant', ':leanback-1.0.0', ':fragment-1.1.0', ':filepicker-lib', ':doubletapplayerview', ':slidableactivity'

def rootDir = settingsDir

// A repo cloned next to this one (see Build in README.md)
def siblingRepo = { String name ->
    File dir = new File(rootDir, "../$name")

    if (!dir.exists()) {
        throw new GradleException("$name not found at ${dir.canonicalPath}. Clone https://github.com/cygnusx-1-org/${name}.git next to electriceel.")
    }

    return dir
}

gradle.ext.sharedModulesRoot = siblingRepo('SharedModules')
apply from: new File(gradle.ext.sharedModulesRoot, 'core_settings.gradle')

gradle.ext.sharedModulesConstants = new File(gradle.ext.sharedModulesRoot, 'constants.gradle')

gradle.ext.mediaServiceCoreRoot = siblingRepo('MediaServiceCore')
apply from: new File(gradle.ext.mediaServiceCoreRoot, 'core_settings.gradle')

// git submodule
gradle.ext.exoplayerRoot = new File(rootDir, './exoplayer-amzn-2.10.6')
gradle.ext.exoplayerModulePrefix = 'exoplayer-'
apply from: new File(gradle.ext.exoplayerRoot, 'core_settings.gradle')

