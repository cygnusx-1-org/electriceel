apply from: gradle.ext.sharedModulesConstants
apply plugin: 'com.android.library'

android {
    namespace 'androidx.fragment'
    // FIX: Default interface methods are only supported starting with Android N (--min-api 24)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_24
        targetCompatibility JavaVersion.VERSION_24
    }

    compileSdkVersion project.properties.compileSdkVersion
    buildToolsVersion project.properties.buildToolsVersion
    testOptions.unitTests.includeAndroidResources = true

    defaultConfig {
        minSdkVersion project.properties.minSdkVersion
        targetSdkVersion project.properties.targetSdkVersion
        versionCode 10
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api 'androidx.activity:activity:' + activityXVersion // used inside other app modules
    implementation 'androidx.annotation:annotation:' + annotationXVersion
    implementation 'androidx.core:core:' + coreXVersion
    implementation 'androidx.viewpager:viewpager:' + viewpagerXVersion
    implementation 'androidx.loader:loader:' + loaderXVersion
}
